<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm border-0 animate__animated animate__fadeIn">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-trash-can text-danger fs-1"></i>

                        <h2 class="fw-bold mt-3">
                            Eliminar país
                        </h2>

                        <p class="text-muted">
                            Busca el país que deseas eliminar.
                        </p>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            <i class="fa-solid fa-magnifying-glass me-2"></i>
                            Buscar por
                        </label>

                        <div class="row g-2">

                            <div class="col-6">

                                <button
                                        type="button"
                                        class="btn w-100"
                                        [class.btn-danger]="metodo === 'nombre'"
                                        [class.btn-outline-danger]="metodo !== 'nombre'"
                                        (click)="metodo = 'nombre'">

                                    <i class="fa-solid fa-earth-americas me-2"></i>
                                    Nombre

                                </button>

                            </div>

                            <div class="col-6">

                                <button
                                        type="button"
                                        class="btn w-100"
                                        [class.btn-danger]="metodo === 'capital'"
                                        [class.btn-outline-danger]="metodo !== 'capital'"
                                        (click)="metodo = 'capital'">

                                    <i class="fa-solid fa-city me-2"></i>
                                    Capital

                                </button>

                            </div>

                        </div>

                    </div>

                    <form (ngSubmit)="eliminar()">

                        <div
                                *ngIf="metodo === 'nombre'"
                                class="animate__animated animate__fadeIn">

                            <label
                                    for="nombre"
                                    class="form-label fw-semibold">

                                <i class="fa-solid fa-earth-americas me-2"></i>
                                Nombre del país

                            </label>

                            <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    class="form-control form-control-lg"
                                    placeholder="Ej. Colombia"
                                    [(ngModel)]="nombre"
                                    autocomplete="off">

                        </div>

                        <div
                                *ngIf="metodo === 'capital'"
                                class="animate__animated animate__fadeIn">

                            <label
                                    for="capital"
                                    class="form-label fw-semibold">

                                <i class="fa-solid fa-city me-2"></i>
                                Capital

                            </label>

                            <input
                                    type="text"
                                    id="capital"
                                    name="capital"
                                    class="form-control form-control-lg"
                                    placeholder="Ej. Bogotá"
                                    [(ngModel)]="capital"
                                    autocomplete="off">

                        </div>

                        <div class="d-grid mt-4">

                            <button
                                    type="submit"
                                    class="btn btn-danger btn-lg">

                                <i class="fa-solid fa-trash-can me-2"></i>
                                Eliminar país

                            </button>

                        </div>

                    </form>

                    <div
                            *ngIf="mensaje"
                            class="alert mt-4 mb-0 animate__animated animate__fadeIn"
                            [class.alert-success]="exito"
                            [class.alert-danger]="!exito">

                        <div class="d-flex align-items-center">

                            <i
                                    class="fa-solid fa-lg me-3"
                                    [class.fa-circle-check]="exito"
                                    [class.fa-circle-xmark]="!exito">
                            </i>

                            <div>

                                <strong>
                                    {{ exito ? 'Operación exitosa' : 'Error' }}
                                </strong>

                                <div>
                                    {{ mensaje }}
                                </div>

                                <small *ngIf="codigoHttp > 0">
                                    Código HTTP:
                                    <strong>{{ codigoHttp }}</strong>
                                </small>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
