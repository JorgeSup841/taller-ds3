<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-7 col-lg-5">

            <div class="card border-0 shadow animate__animated animate__fadeIn">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-trash-can text-info icono-basura"></i>

                        <h2 class="fw-bold mt-3 text-white mb-2">
                            Eliminar país
                        </h2>

                        <p class="text-secondary mb-0">
                            Busca el país que deseas eliminar.
                        </p>

                    </div>

                    <div class="search-section mb-4">

                        <label class="search-label">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            Buscar por
                        </label>

                        <div class="row g-2">

                            <div class="col-6">

                                <button
                                        type="button"
                                        class="btn w-100"
                                        [class.btn-info]="metodo === 'nombre'"
                                        [class.btn-outline-info]="metodo !== 'nombre'"
                                        (click)="metodo = 'nombre'">

                                    <i class="fa-solid fa-earth-americas me-2"></i>
                                    Nombre

                                </button>

                            </div>

                            <div class="col-6">

                                <button
                                        type="button"
                                        class="btn w-100"
                                        [class.btn-info]="metodo === 'capital'"
                                        [class.btn-outline-info]="metodo !== 'capital'"
                                        (click)="metodo = 'capital'">

                                    <i class="fa-solid fa-city me-2"></i>
                                    Capital

                                </button>

                            </div>

                        </div>

                    </div>

                    <form (ngSubmit)="eliminar()">

                        <div
                                *ngIf="metodo === 'nombre'"
                                class="animate__animated animate__fadeIn">

                            <label
                                    for="nombre"
                                    class="form-label">

                                <i class="fa-solid fa-earth-americas me-2"></i>
                                Nombre del país

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fa-solid fa-globe"></i>
                                </span>

                                <input
                                        type="text"
                                        id="nombre"
                                        name="nombre"
                                        class="form-control"
                                        placeholder="Ej. Colombia"
                                        [(ngModel)]="nombre"
                                        autocomplete="off">

                            </div>

                        </div>

                        <div
                                *ngIf="metodo === 'capital'"
                                class="animate__animated animate__fadeIn">

                            <label
                                    for="capital"
                                    class="form-label">

                                <i class="fa-solid fa-city me-2"></i>
                                Capital

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="fa-solid fa-building"></i>
                                </span>

                                <input
                                        type="text"
                                        id="capital"
                                        name="capital"
                                        class="form-control"
                                        placeholder="Ej. Bogotá"
                                        [(ngModel)]="capital"
                                        autocomplete="off">

                            </div>

                        </div>

                        <div class="d-grid mt-4">

                            <button
                                    type="submit"
                                    class="btn btn-info btn-lg">

                                <i class="fa-solid fa-trash-can me-2"></i>
                                Eliminar país

                            </button>

                        </div>

                    </form>

                    <div
                            *ngIf="mensaje"
                            class="alert mt-4 mb-0 animate__animated animate__fadeIn"
                            [class.alert-success]="exito"
                            [class.alert-danger]="!exito">

                        <i
                                class="fa-solid me-2"
                                [class.fa-circle-check]="exito"
                                [class.fa-circle-xmark]="!exito">
                        </i>

                        {{ mensaje }}

                        <small
                                *ngIf="codigoHttp > 0"
                                class="d-block mt-1">

                            Código HTTP: {{ codigoHttp }}

                        </small>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
