<div class="container-fluid px-4 mt-4">
    <div class="row align-items-center">


        <div class="col-md-6">
            <form>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Nombre</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text" style="color: #9ca3af;">We'll never share your email with
                        anyone else.
                    </div>
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Moneda</label>
                    <input type="text" class="form-control" id="exampleInputPassword1">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Capital</label>
                    <input type="text" class="form-control" id="exampleInputPassword1">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Idiomas</label>
                    <input type="text" class="form-control" id="exampleInputPassword1">
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text">Cantidad de Habitantes</span>
                    <input type="number" class="form-control" step="1" min="0" [(ngModel)]="valor" name="valor">
                    <span class="input-group-text">.00</span>
                </div>
                <button type="submit" class="btn btn-primary">Crear</button>
            </form>
        </div>


        <div class="col-md-6">
            <div id="carouselExampleDark"
                 class="carousel carousel-dark slide shadow rounded overflow-hidden carrusel-limite">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active"
                            aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1"
                            aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2"
                            aria-label="Slide 3"></button>
                </div>

                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="10000">
                        <img src="assets/sixsevenpaises.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2 text-white">
                        </div>
                    </div>
                    <div class="carousel-item" data-bs-interval="2000">
                        <img src="assets/platabien.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2 text-white">

                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="assets/idiomas.jpg" class="d-block w-100" alt="...">
                        <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2 text-white">

                        </div>
                    </div>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark"
                        data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark"
                        data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

    </div>
</div>
