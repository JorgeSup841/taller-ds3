
<div class="container py-5">

    <div class="row justify-content-center align-items-center g-4">

        <div class="col-12 col-lg-6">

            <div class="card border-0 shadow animate__animated animate__fadeIn">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <i class="fa-solid fa-earth-americas icono-pais"></i>

                        <h2 class="fw-bold mt-3 text-white mb-2">
                            Crear país
                        </h2>

                        <p class="text-secondary mb-0">
                            Ingresa la información del nuevo país.
                        </p>

                    </div>

                    <form (ngSubmit)="crear()">

                        <div class="row g-3">

                            <div class="col-12">

                                <label
                                        for="nombre"
                                        class="form-label">

                                    <i class="fa-solid fa-earth-americas me-2"></i>
                                    Nombre

                                </label>

                                <input
                                        type="text"
                                        id="nombre"
                                        name="nombre"
                                        class="form-control"
                                        placeholder="Ej. Colombia"
                                        [(ngModel)]="pais.nombre"
                                        autocomplete="off">

                            </div>

                            <div class="col-md-6">

                                <label
                                        for="capital"
                                        class="form-label">

                                    <i class="fa-solid fa-city me-2"></i>
                                    Capital

                                </label>

                                <input
                                        type="text"
                                        id="capital"
                                        name="capital"
                                        class="form-control"
                                        placeholder="Ej. Bogotá"
                                        [(ngModel)]="pais.capital"
                                        autocomplete="off">

                            </div>

                            <div class="col-md-6">

                                <label
                                        for="moneda"
                                        class="form-label">

                                    <i class="fa-solid fa-coins me-2"></i>
                                    Moneda

                                </label>

                                <input
                                        type="text"
                                        id="moneda"
                                        name="moneda"
                                        class="form-control"
                                        placeholder="Ej. Peso colombiano"
                                        [(ngModel)]="pais.moneda"
                                        autocomplete="off">

                            </div>

                            <div class="col-12">

                                <label
                                        for="idiomas"
                                        class="form-label">

                                    <i class="fa-solid fa-language me-2"></i>
                                    Idiomas

                                </label>

                                <input
                                        type="text"
                                        id="idiomas"
                                        name="idiomas"
                                        class="form-control"
                                        placeholder="Ej. Español"
                                        [(ngModel)]="pais.idiomas"
                                        autocomplete="off">

                            </div>

                            <div class="col-12">

                                <label
                                        for="habitantes"
                                        class="form-label">

                                    <i class="fa-solid fa-users me-2"></i>
                                    Habitantes

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-users"></i>
                                    </span>

                                    <input
                                            type="number"
                                            id="habitantes"
                                            name="habitantes"
                                            class="form-control"
                                            placeholder="Ej. 52000000"
                                            [(ngModel)]="pais.habitantes"
                                            min="0">

                                </div>

                            </div>

                        </div>

                        <div class="d-grid mt-4">

                            <button
                                    type="submit"
                                    class="btn btn-info btn-lg">

                                <i class="fa-solid fa-plus me-2"></i>
                                Crear país

                            </button>

                        </div>

                    </form>

                    <div
                            *ngIf="mensaje"
                            class="alert mt-4 mb-0 animate__animated animate__fadeIn"
                            [class.alert-success]="exito"
                            [class.alert-danger]="!exito">

                        <i
                                class="fa-solid me-2"
                                [class.fa-circle-check]="exito"
                                [class.fa-circle-xmark]="!exito">
                        </i>

                        {{ mensaje }}

                        <small
                                *ngIf="codigoHttp > 0"
                                class="d-block mt-1">

                            Código HTTP: {{ codigoHttp }}

                        </small>

                    </div>

                </div>

            </div>

        </div>

        <div class="col-12 col-lg-6">

            <div
                    id="carouselPaises"
                    class="carousel slide shadow rounded overflow-hidden carrusel-limite animate__animated animate__fadeIn">

                <div class="carousel-indicators">

                    <button
                            type="button"
                            data-bs-target="#carouselPaises"
                            data-bs-slide-to="0"
                            class="active"
                            aria-current="true"
                            aria-label="Slide 1">
                    </button>

                    <button
                            type="button"
                            data-bs-target="#carouselPaises"
                            data-bs-slide-to="1"
                            aria-label="Slide 2">
                    </button>

                    <button
                            type="button"
                            data-bs-target="#carouselPaises"
                            data-bs-slide-to="2"
                            aria-label="Slide 3">
                    </button>

                </div>

                <div class="carousel-inner">

                    <div
                            class="carousel-item active"
                            data-bs-interval="5000">

                        <img
                                src="assets/sixsevenpaises.jpg"
                                class="d-block w-100"
                                alt="Países">

                    </div>

                    <div
                            class="carousel-item"
                            data-bs-interval="5000">

                        <img
                                src="assets/platabien.jpg"
                                class="d-block w-100"
                                alt="Monedas">

                    </div>

                    <div
                            class="carousel-item"
                            data-bs-interval="5000">

                        <img
                                src="assets/idiomas.jpg"
                                class="d-block w-100"
                                alt="Idiomas">

                    </div>

                </div>

                <button
                        class="carousel-control-prev"
                        type="button"
                        data-bs-target="#carouselPaises"
                        data-bs-slide="prev">

                    <span
                            class="carousel-control-prev-icon"
                            aria-hidden="true">
                    </span>

                    <span class="visually-hidden">
                        Anterior
                    </span>

                </button>

                <button
                        class="carousel-control-next"
                        type="button"
                        data-bs-target="#carouselPaises"
                        data-bs-slide="next">

                    <span
                            class="carousel-control-next-icon"
                            aria-hidden="true">
                    </span>

                    <span class="visually-hidden">
                        Siguiente
                    </span>

                </button>

            </div>

        </div>

    </div>

</div>
